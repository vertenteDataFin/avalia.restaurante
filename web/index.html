<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Avalia Restaurante - App de Feedback & Reclamação de Refeições">
  <meta name="theme-color" content="#005A2B">

  <!-- iOS / Web App meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Avalia Restaurante">
  <link rel="apple-touch-icon" href="favicon.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="favicon.jpg"/>
  <link rel="shortcut icon" type="image/jpeg" href="favicon.jpg"/>

  <title>Avalia Restaurante</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      touch-action: manipulation;
      background-color: #005A2B;
    }
  </style>
  <script>
    function toggleFullScreen() {
      var doc = window.document;
      var docEl = doc.documentElement;
      var requestNativeFullscreen = docEl.requestFullscreen || docEl.mozRequestPrefix || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      var cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if(!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestNativeFullscreen) {
          requestNativeFullscreen.call(docEl);
        }
      } else {
        if (cancelFullScreen) {
          cancelFullScreen.call(doc);
        }
      }
      window.scrollTo(0, 1);
    }

    // Oculta a barra de endereços do navegador em dispositivos móveis no carregamento
    window.addEventListener("load", function() {
      setTimeout(function() {
        window.scrollTo(0, 1);
      }, 100);
    });

    // Forçar atualização imediata do navegador para a versão mais recente
    var APP_VERSION = "20260904_v7";
    if (!window.location.search.includes("v=" + APP_VERSION)) {
      window.location.replace(window.location.pathname + "?v=" + APP_VERSION + window.location.hash);
    }

    // Limpeza forçada de Service Worker e CacheStorage antigo para garantir versão atualizada
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js?v=20260904_v7" async></script>
</body>
</html>
